name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      # Native release tags only. The ESM package uses esm-v* and is handled
      # by npm-publish.yml; a bare "*" here would make that tag try to upload
      # prebuilds to a release of its own.
      - "v*"
env:
  FORCE_COLOR: 1
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  # macOS + Windows only. Linux prebuilds come from the Docker jobs below so
  # they link against an older GLIBC than the GitHub-hosted Ubuntu runners.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
        host:
          - x64
        target:
          - x64
        node:
          - 20
          - 22
          - 24
        exclude:
          # Node 20 x64 crashes under Rosetta 2 on ARM64 macOS runners
          - os: macos-latest
            node: 20
            host: x64
        include:
          # Node 24 no longer ships 32-bit Windows binaries, so ia32 builds on Node 22
          - os: windows-latest
            node: 22
            host: x86
            target: x86
          - os: macos-latest
            node: 20
            host: arm64
            target: arm64
          - os: macos-latest
            node: 22
            host: arm64
            target: arm64
          - os: macos-latest
            node: 24
            host: arm64
            target: arm64
    name: ${{ matrix.os }} (node=${{ matrix.node }}, host=${{ matrix.host }}, target=${{ matrix.target }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.host }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.3
        if: contains(matrix.os, 'windows')
        with:
          msbuild-architecture: ${{ matrix.target }}

      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Check Node compatibility
        run: node tools/semver-check.js

      - name: Add env vars
        shell: bash
        run: |
          echo "V=1" >> $GITHUB_ENV

          if [ "${{ matrix.target }}" = "x86" ]; then
            echo "TARGET=ia32" >> $GITHUB_ENV
          else
            echo "TARGET=${{ matrix.target }}" >> $GITHUB_ENV
          fi

      - name: Build binaries
        run: yarn prebuild -a ${{ env.TARGET }}

      - name: Run tests
        run: yarn test

      - name: Upload binaries to commit artifacts
        uses: actions/upload-artifact@v7
        if: matrix.node == 24 || matrix.target == 'x86'
        with:
          name: prebuilt-binaries-${{ matrix.os }}-${{ matrix.host }}-${{ matrix.target }}
          path: prebuilds/*
          retention-days: 7

      - name: Upload binaries to GitHub Release
        run: yarn upload --upload-all ${{ github.token }}
        if: (matrix.node == 24 || matrix.target == 'x86') && startsWith(github.ref, 'refs/tags/')

  # Ubuntu 20.04 builds for older GLIBC compatibility
  build-linux-docker:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
        arch:
          - x64
          - arm64
        include:
          - arch: x64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    name: Ubuntu 20.04 (node=${{ matrix.node }}, arch=${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build binaries and test in Docker
        run: |
          docker buildx build \
            --file ./tools/Ubuntu20Builder.Dockerfile \
            --load \
            --tag sqlite-builder-ubuntu20 \
            --platform ${{ matrix.platform }} \
            --cache-from type=gha,scope=ubuntu20-${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=ubuntu20-${{ matrix.arch }} \
            --build-arg NODE_VERSION=${{ matrix.node }} \
            .
          CONTAINER_ID=$(docker create -it sqlite-builder-ubuntu20)
          docker cp $CONTAINER_ID:/usr/src/build/prebuilds/ ./prebuilds
          docker rm $CONTAINER_ID

      - name: Upload binaries to commit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-binaries-ubuntu20-${{ matrix.arch }}
          path: prebuilds/*
          retention-days: 7

      - name: Upload binaries to GitHub Release
        run: yarn install --ignore-scripts && yarn upload --upload-all ${{ github.token }}
        if: startsWith(github.ref, 'refs/tags/')

  # Alpine builds for musl libc compatibility (Docker/K8s use cases)
  build-alpine:
    runs-on: ${{ matrix.config.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
        config:
          # Oldest Alpine with a node:20 image, for the widest musl compatibility
          - platform: linux/arm64
            arch: arm64
            variant: alpine3.17
          - platform: linux/amd64
            arch: amd64
            variant: alpine3.17
    name: ${{ matrix.config.variant }} (node=${{ matrix.node }}, arch=${{ matrix.config.arch }})
    steps:
      - uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build binaries and test
        run: |
          docker build \
            --file ./tools/BinaryBuilder.Dockerfile \
            --tag sqlite-builder \
            --platform ${{ matrix.config.platform }} \
            --cache-from type=gha,scope=alpine-${{ matrix.config.arch }} \
            --cache-to type=gha,mode=max,scope=alpine-${{ matrix.config.arch }} \
            --build-arg VARIANT=${{ matrix.config.variant }} \
            --build-arg NODE_VERSION=${{ matrix.node }} \
            .
          CONTAINER_ID=$(docker create -it sqlite-builder)
          docker cp $CONTAINER_ID:/usr/src/build/prebuilds/ ./prebuilds
          docker rm $CONTAINER_ID

      - name: Upload binaries to commit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-binaries-${{ matrix.config.variant }}-${{ matrix.config.arch }}
          path: prebuilds/*
          retention-days: 7

      - name: Upload binaries to GitHub Release
        run: yarn install --ignore-scripts && yarn upload --upload-all ${{ github.token }}
        if: startsWith(github.ref, 'refs/tags/')
