name: Publish @karinjs/sqlite3

# Publishes the ESM/CJS distribution in esm/ to npm.
#
# @karinjs/sqlite3 is versioned to match the native sqlite3 package, so one
# version number picks the GitHub Release to download, the published main
# package version, and the 8 platform package versions.
#
# The binaries are not built here - they come from the GitHub Release named
# after that version, so the release has to exist first:
#   1. bump the root package.json, tag vX.Y.Z   -> ci.yml builds and uploads prebuilds
#   2. tag esm-vX.Y.Z (same X.Y.Z)              -> this workflow packages and publishes them
#
# To backfill an older release, run this manually with the version input set
# (e.g. 5.1.9); it is passed through as SQLITE3_VERSION.
#
# Auth is npm trusted publishing (OIDC): no NPM_TOKEN. Every package published
# here must have this repo + this workflow file registered as a trusted publisher
# on npmjs.com - that is the main package plus all 8 platform packages.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package and publish (default: root package.json). Use this to backfill, e.g. 5.1.9"
        type: string
        required: false
      dry_run:
        description: "Build and pack everything, but do not publish"
        type: boolean
        default: false
  push:
    tags:
      - "esm-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, newer than what Node 22 bundles
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        working-directory: esm
        run: npm install

      - name: Build ESM/CJS bundle
        working-directory: esm
        run: npm run build

      - name: Download prebuilds and generate platform packages
        working-directory: esm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQLITE3_VERSION: ${{ inputs.version }}
        run: npm run build:package

      - name: Show what will be published
        working-directory: esm
        run: |
          echo "publishing @karinjs/sqlite3@$(node -p "require('./package.json').version")"
          echo "binaries from release v$(node -p "require('./package.json').version")"
          node -p "JSON.stringify(require('./package.json').optionalDependencies, null, 2)"

      # Platform packages go first: the main package pins them as
      # optionalDependencies at an exact version.
      - name: Publish platform packages
        working-directory: esm/packages
        run: |
          set -euo pipefail
          for dir in */; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "== dry run: $name"
              ( cd "$dir" && npm publish --access public --dry-run )
            else
              echo "== publishing: $name"
              ( cd "$dir" && npm publish --access public )
              curl -fsS -X PUT "https://registry-direct.npmmirror.com/-/package/$name/syncs" || \
                echo "npmmirror sync failed for $name (non-fatal)"
            fi
          done

      - name: Publish main package
        working-directory: esm
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
            curl -fsS -X PUT "https://registry-direct.npmmirror.com/-/package/@karinjs/sqlite3/syncs" || \
              echo "npmmirror sync failed (non-fatal)"
          fi
